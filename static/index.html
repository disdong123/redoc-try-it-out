<html>
  <head>
    <script type="text/javascript" src="./try-it-out.min.js"></script>
    .
  </head>
  <body>
    <div id="redoc_container"></div>
    <script>
      RedocTryItOut.init(
        "https://petstore3.swagger.io/api/v3/openapi.json",
        {
          redocVersion: "2.5.0",
          // Specify the place where you have stored the dependencies this library pulls down
          //cdnUrl: "https://cdn.redoc.ly", // <- will fail with 404 because this cdn doesnt have jquery :)
          //cdnUrl: "./test", // <- will also fail with 4094
          // cdnUrl: "/",
          theme: {
            spacing: {
              unit: 4,
              sectionHorizontal: 100,
              sectionVertical: 100,
            },
          },
          disableSearch: true,
          hideLoading: true,
          untrustedDefinition: true,
          sortOperationsAlphabetically: false,
          scrollYOffset: 100,
          nativeScrollbars: false,
          pathInMiddlePanel: true,
        },
        document.getElementById("redoc_container"),
      );
    </script>
    <style>
      .tryBtn {
        border: 0;
        border-radius: 0;
        box-shadow: none;
        border-top: 1px solid rgb(50, 50, 159);
        border-right: 1px solid rgb(50, 50, 159);
        border-left: 1px solid rgb(50, 50, 159);
        border-bottom: 1px solid rgb(50, 50, 159);
        font-family: Montserrat, sans-serif;
        font-size: 13.006px;
        font-weight: 400;
        line-height: 20px;
        color: rgb(50, 50, 159);
        padding: 3px 10px;
        background-color: white;
        margin-left: 2px;
        cursor: pointer;
      }
    </style>
  </body>
</html>
